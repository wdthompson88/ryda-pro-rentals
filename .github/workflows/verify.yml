name: verify

# Push is scoped to main on purpose. A branch with an open PR would
# otherwise fire both a `push` and a `pull_request` run for the same commit,
# billing two runs for one answer against the free tier's monthly minutes.
# Branch work is covered by the pull_request trigger.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing available on a free private repo can BLOCK a push to main:
  # branch protection and rulesets are Pro-gated, pre-receive hooks are
  # Enterprise, and Actions only run after the push has already landed.
  # The .githooks/pre-push guard catches the accident but loses to
  # `--no-verify`.
  #
  # So this job does not prevent. It makes a bypass impossible to miss:
  # a direct push to main with no pull request behind it puts a red X on
  # main and emails the repo owner. Detection, loudly, instead of silence.
  direct-push-guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fail if this commit reached main without a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "::error::${{ github.sha }} was pushed straight to main with no pull request behind it. See AGENTS.md: branch, PR, merge on green. To undo: git revert ${{ github.sha }}"
            exit 1
          fi
          echo "OK - commit arrived via pull request."

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24.x is what Vercel runs in production for this project. CI must
          # match the production runtime, not merely be "recent".
          node-version: 24
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm run test

      # No secrets are exposed to CI. The app is designed to fall back
      # cleanly when Supabase/Stripe/Resend vars are unset (see
      # .env.local.example), so a build with placeholder public vars still
      # proves the bundle compiles. Real values live in Vercel.
      - name: build
        env:
          NEXT_PUBLIC_SITE_URL: https://ryda.pro
        run: npm run build
